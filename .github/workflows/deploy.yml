name: Deploy

# Render's GitHub App is not installed on this repository, so pushes do not
# start a build on their own. This workflow runs the checks and then pokes
# Render's deploy hook, which is what a connected repository would do.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order. A later push waits for the current
# deploy instead of cancelling it and leaving Render mid-build.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice title=Deploy skipped::RENDER_DEPLOY_HOOK is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          status=$(curl -sS -X POST -H "Accept: application/json" \
            -o response.json -w "%{http_code}" "$DEPLOY_HOOK")

          echo "Render answered HTTP $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Render rejected the deploy hook"
            cat response.json
            exit 1
          fi

          # The response carries the deploy id; the URL itself holds a token, so
          # only the id and status are printed.
          node -e '
            const body = require("./response.json");
            console.log(`deploy ${body.deploy?.id ?? body.id ?? "started"}`);
          '

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Render deploy triggered for \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Watch progress](https://dashboard.render.com/web/srv-dbi3qrjbc2fs73a1ekag)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: \`RENDER_DEPLOY_HOOK\` is not set." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
